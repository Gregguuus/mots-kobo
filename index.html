<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe94a">
<meta name="apple-mobile-web-app-title" content="Mots Kobo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Mots Kobo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,700&family=Inter+Tight:wght@400;600;800&display=swap">
<style>
/* VOICE: joyeux et rapide, comme un jeu de poche
   IDEA: le feutre fluo du lecteur : chaque bonne réponse surligne un peu plus la page
   PICTURE: la carte de jeu en grand, barre d'XP comme un trait de surligneur
   COLOUR and TYPE: papier blanc, graphite, fluo jaune, vert/rouge pour juste/faux ; Literata + Inter Tight
   LAYOUT: en-tête niveau/série/objectif, tuiles de jeux, puis l'écran de jeu en plein */
:root{color-scheme:light dark;--bg:light-dark(#efeee9,#141412);--card:light-dark(#fff,#1f1f1c);--ink:light-dark(#1b1a17,#f1efe7);--soft:light-dark(#6b6960,#a19f95);--line:light-dark(#dcdad2,#34332e);--hl:light-dark(#ffe94a,#e6cf2a);--ok:light-dark(#1d7a4f,#5fd39a);--ko:light-dark(#c0362c,#ff8a80);--sh:0 18px 40px -26px rgba(0,0,0,.45)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font:800 26px/1 "Inter Tight";margin:0;flex:1}.logo span{background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%)}
.home-btn{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.hud{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:16px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.pill b{font-size:20px;line-height:1}.pill small{display:block;color:var(--soft);font-size:12px}
.xpbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.xpbar i{display:block;height:100%;background:var(--hl);border-radius:6px;transition:width .5s}
.ring{width:38px;height:38px;flex:none}
.banner{background:var(--hl);color:#1b1a17;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:14px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:18px 16px 16px;min-height:132px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.game svg{width:34px;height:34px}
.game b{font-size:19px}.game small{color:var(--soft);font-size:14px;line-height:1.35}
.game .tag{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px}
.game.big{grid-column:1/-1;background:var(--hl);color:#1b1a17;border-color:transparent;min-height:120px}
.game.big small{color:#4a4630}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:clamp(18px,5vw,30px);min-height:420px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--soft);font-size:13px;flex-wrap:wrap;align-items:center}
.word{font:700 clamp(34px,9vw,50px)/1.05 Literata,serif;margin:4px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fr-q{font:700 clamp(24px,6vw,32px)/1.2 "Inter Tight";margin:4px 0 0}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ctx{font:400 17px/1.6 Literata,serif;margin:0}
mark{background:linear-gradient(transparent 12%,var(--hl) 12% 90%,transparent 90%);color:#1b1a17;padding:0 2px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;font-size:16px;line-height:1.35;padding:13px 16px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--ko);box-shadow:inset 0 0 0 2px var(--ko);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{min-height:50px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:16px;flex:1 1 140px}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.good{border-color:var(--ok);color:var(--ok)}.btn.bad{border-color:var(--ko);color:var(--ko)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.back{border-top:1px dashed var(--line);padding-top:12px}
.ici{font:700 21px/1.3 "Inter Tight";margin:0 0 6px}.ici small{display:block;font:600 12px "Inter Tight";color:var(--soft);margin-bottom:2px}
.senses{margin:0;padding-left:18px;color:var(--soft);font-size:15px}.senses i{color:var(--ink)}
.timer{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.timer i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.combo{font-weight:800;font-size:15px;padding:3px 10px;border-radius:999px;background:var(--hl);color:#1b1a17}
.big-n{font:800 clamp(56px,16vw,88px)/1 "Inter Tight";margin:0;text-align:center}
.center{text-align:center}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:64px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;line-height:1.25;transition:opacity .3s,transform .3s}
.tile.en{font:700 18px Literata,serif}
.tile.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
.tile.miss{animation:shake .3s;box-shadow:inset 0 0 0 2px var(--ko)}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.search{width:100%;font:16px "Inter Tight";min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
details.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
details.item summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline;list-style:none}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{font:700 18px Literata,serif}details.item summary span{color:var(--soft);font-size:14px;text-align:right}
.missed{margin:0;padding:0;list-style:none;text-align:left}.missed li{padding:6px 0;border-bottom:1px solid var(--line)}
.foot{color:var(--soft);font-size:13px;margin-top:24px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fx i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
.float{position:absolute;right:20px;top:16px;font-weight:800;color:var(--ok);animation:up .8s ease-out forwards}
@keyframes up{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-28px)}}
@media(max-width:420px){.hud{grid-template-columns:1fr 1fr}.hud .pill:first-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 class="logo">Mots <span>Kobo</span></h1><button class="home-btn" id="home" hidden>Accueil</button></div>
  <div id="banner"></div>
  <div class="hud" id="hud"></div>
  <main id="view"><div class="card"><p class="center" style="margin:auto">Chargement de tes mots…</p></div></main>
  <p class="foot" id="foot">Tes nouveaux surlignages arrivent tout seuls dès que ta Kobo a le Wi-Fi. Ta progression est gardée sur cet appareil.</p>
</div>
<div class="fx" id="fx"></div>
<script>
{
const ICO={
 say:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>',
 pairs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="11" rx="2"/><rect x="13" y="9" width="8" height="11" rx="2" fill="var(--hl)"/></svg>',
 gap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h6M15 7h6M3 12h4M17 12h4M3 17h18"/><path d="M9 12h6" stroke="var(--hl)" stroke-width="4"/></svg>',
 cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="14" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 flame:'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#ff8a1f"/><path d="M12 13c1 2 3 3 3 5a3 3 0 0 1-6 0c0-1 1-2 1-3 1 1 2 0 2-2z" fill="#ffe94a"/></svg>'
};
const DAY=864e5,GAPS=[0,1,2,4,8,16,32],GOAL=200,LS='motsKobo.v2';
let WORDS=[],PROG={},ST={xp:0,days:{},best:{}},offline=false;
const $=id=>document.getElementById(id),view=$('view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}catch(e){return d}};
const P=w=>PROG[w.w]||{box:0,due:0};
const mean=w=>w.i||(w.t&&w.t[0]?w.t[0][1]:'?');
const ctxHTML=(w,blank)=>w.c?esc(w.c).replace(/&lt;&lt;(.*?)&gt;&gt;/,(m,x)=>blank?'<span class="blank">&nbsp;</span>':'<mark>'+x+'</mark>'):'<i style="color:var(--soft)">Phrase pas encore retrouvée.</i>';
const dots=b=>'<span class="dots">'+[1,2,3,4,5,6].map(i=>'<i class="'+(i<=b?'on':'')+'"></i>').join('')+'</span>';
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
/* ---------- stockage : Kobo d'abord, copie locale en secours ---------- */
function local(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(LS+k)||'null');localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){return null}}
function setOffline(b){offline=b;$('banner').innerHTML=b?'<div class="banner">Hors connexion : tu joues avec tes mots enregistrés.</div>':''}
const saveStats=()=>local('stats',ST);
const send=()=>{};
function setProg(w,good){const p=P(w),b=good?Math.min(p.box+1,6):0;PROG[w.w]={box:b,due:good?Date.now()+GAPS[b]*DAY:Date.now()};local('prog',PROG)}
/* ---------- XP, niveaux, série ---------- */
const level=xp=>Math.floor(Math.sqrt(xp/40))+1, lvlXP=l=>40*(l-1)**2;
function streak(){let n=0,d=new Date();if(!ST.days[today()])d=new Date(Date.now()-DAY);while(ST.days[d.toISOString().slice(0,10)]){n++;d=new Date(d-DAY)}return n}
function gain(n,el){const before=level(ST.xp);ST.xp+=n;ST.days[today()]=(ST.days[today()]||0)+n;saveStats();hud();
  if(el){const f=document.createElement('span');f.className='float';f.textContent='+'+n;el.appendChild(f);setTimeout(()=>f.remove(),800)}
  if(level(ST.xp)>before)confetti('Niveau '+level(ST.xp)+' !')}
function confetti(msg){const fx=$('fx'),cols=['#ffe94a','#ff8a1f','#5fd39a','#6aa8ff','#ff6b9a'];for(let i=0;i<60;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDelay=Math.random()*.4+'s';fx.appendChild(c);setTimeout(()=>c.remove(),2200)}
  if(msg){const b=document.createElement('div');b.className='banner';b.style.cssText='position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:10;box-shadow:var(--sh)';b.textContent=msg;document.body.appendChild(b);setTimeout(()=>b.remove(),2200)}}
function hud(){const xp=ST.xp,l=level(xp),a=lvlXP(l),b=lvlXP(l+1),pc=Math.round((xp-a)/(b-a)*100),dt=ST.days[today()]||0,g=Math.min(dt/GOAL,1);
  const C=2*Math.PI*15;
  $('hud').innerHTML='<div class="pill"><div style="flex:1"><small>Niveau</small><b>'+l+'</b> <span style="color:var(--soft);font-size:13px">'+xp+' XP</span><div class="xpbar"><i style="width:'+pc+'%"></i></div></div></div>'+
   '<div class="pill">'+ICO.flame+'<div><b>'+streak()+'</b><small>jour'+(streak()>1?'s':'')+' de suite</small></div></div>'+
   '<div class="pill"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(C*g)+' '+C+'" transform="rotate(-90 18 18)"/></svg><div><b>'+Math.min(dt,GOAL)+'</b><small>/ '+GOAL+' XP du jour</small></div></div>'}
/* ---------- accueil ---------- */
function home(){$('home').hidden=true;hud();const due=WORDS.filter(w=>P(w).due<=Date.now()).length;
  const tiles=[['flash','big',ICO.bolt,'Défi éclair','60 secondes, un max de bonnes réponses. Les séries font monter le multiplicateur.',ST.best.flash?'Record '+ST.best.flash:''],
   ['pairs','',ICO.pairs,'Paires','Associe 5 mots à leur traduction, le plus vite possible.',ST.best.pairs?'Record '+ST.best.pairs+' s':''],
   ['cloze','',ICO.gap,'Phrase à trous','Retrouve le mot dans la phrase de ton livre.',''],
   ['cards','',ICO.cards,'Fiches','Révision espacée : les mots ratés reviennent plus souvent.',due?due+' à revoir':''],
   ['list','',ICO.list,'Mes mots',WORDS.length+' mots de tes livres, avec recherche.','']];
  view.innerHTML='<div class="games">'+tiles.map(t=>'<button class="game '+t[1]+'" data-g="'+t[0]+'">'+t[2]+'<b>'+t[3]+'</b><small>'+t[4]+'</small>'+(t[5]?'<span class="tag">'+t[5]+'</span>':'')+'</button>').join('')+'</div>';
  view.querySelectorAll('.game').forEach(b=>b.onclick=()=>GAMES[b.dataset.g]());}
function inGame(){$('home').hidden=false;try{window.scrollTo(0,0)}catch(e){}}
$('home').onclick=()=>{stopTimers();home()};
let timers=[];const stopTimers=()=>{timers.forEach(clearInterval);timers=[]};
const weak=()=>{const a=shuffle(WORDS);a.sort((x,y)=>P(x).box-P(y).box);return a};
const pick=(n=15)=>{const a=weak();return a[Math.floor(Math.random()*Math.min(n,a.length))]};
function backHTML(w){return '<div class="back"><p class="ici"><small>Sens ici</small>'+esc(mean(w))+'</p>'+(w.t&&w.t.length?'<ul class="senses">'+w.t.map(t=>'<li><i>'+esc(t[0])+'</i> · '+esc(t[1])+'</li>').join('')+'</ul>':'')+'</div>'}
/* ---------- Défi éclair ---------- */
function flash(){inGame();let left=60,score=0,combo=0,missed=[],t0=Date.now(),cur;
  const mult=()=>combo>=6?3:combo>=3?2:1;
  function q(){cur=pick(25);const dir=Math.random()<.6?'en':'fr';const others=shuffle(WORDS.filter(x=>x.w.toLowerCase()!==cur.w.toLowerCase()&&mean(x)!==mean(cur))).slice(0,3);const opts=shuffle([cur,...others]);
    view.innerHTML='<div class="card"><div class="timer"><i id="tb" style="width:'+(left/60*100)+'%"></i></div><div class="meta"><span id="tl">'+left+' s</span><span>'+(mult()>1?'<span class="combo">x'+mult()+'</span> ':'')+'<b id="sc">'+score+'</b> pts</span></div>'+
     (dir==='en'?'<p class="word">'+esc(cur.w)+'</p><p class="ctx" style="color:var(--soft);font-size:15px">Quel est le sens ?</p>':'<p class="fr-q">'+esc(mean(cur))+'</p><p class="ctx" style="color:var(--soft);font-size:15px">Quel mot anglais ?</p>')+
     '<div class="opts">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(dir==='en'?mean(o):o.w)+'</button>').join('')+'</div></div>';
    view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(view.querySelector('.opt.right'))return;const good=opts[+b.dataset.i]===cur;
      view.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.i]===cur)x.classList.add('right')});
      if(good){combo++;const pts=10*mult();score+=pts;gain(pts,view.querySelector('.card'))}else{combo=0;b.classList.add('wrong');left=Math.max(0,left-3);missed.push(cur)}
      setProg(cur,good);setTimeout(()=>left>0&&q(),good?350:900)})}
  q();
  timers.push(setInterval(()=>{left=Math.max(0,60-Math.floor((Date.now()-t0)/1000)-missed.length*3);const tb=$('tb'),tl=$('tl');if(tb)tb.style.width=(left/60*100)+'%';if(tl)tl.textContent=left+' s';if(left<=0){stopTimers();end()}},250));
  function end(){const rec=score>(ST.best.flash||0);if(rec){ST.best.flash=score;saveStats();confetti('Nouveau record !')}
    const uniq=[...new Map(missed.map(w=>[w.w,w])).values()];
    view.innerHTML='<div class="card center"><p style="color:var(--soft);margin:0">Score</p><p class="big-n">'+score+'</p><p style="margin:0">'+(rec?'Nouveau record !':'Record : '+(ST.best.flash||0))+'</p>'+
     (uniq.length?'<p class="ici" style="margin-top:10px"><small>À revoir</small></p><ul class="missed">'+uniq.map(w=>'<li><b>'+esc(w.w)+'</b> · '+esc(mean(w))+'</li>').join('')+'</ul>':'<p>Aucune erreur, bravo.</p>')+
     '<div class="row"><button class="btn" id="hm">Accueil</button><button class="btn main" id="re">Rejouer</button></div></div>';
    $('re').onclick=flash;$('hm').onclick=home}}
/* ---------- Paires ---------- */
function pairs(){inGame();const set=[];for(const w of weak()){if(set.length>=5)break;if(!set.some(s=>mean(s)===mean(w)||s.w.toLowerCase()===w.w.toLowerCase()))set.push(w)}
  const L=shuffle(set),R=shuffle(set);let sel=null,done=0,errors=0;const t0=Date.now();
  view.innerHTML='<div class="card"><div class="meta"><span>Touche un mot puis sa traduction</span><span id="pt">0 s</span></div><div class="pairs">'+
   L.map((w,i)=>'<button class="tile en" data-s="L" data-i="'+i+'">'+esc(w.w)+'</button><button class="tile" data-s="R" data-i="'+i+'">'+esc(mean(R[i]))+'</button>').join('')+'</div></div>';
  timers.push(setInterval(()=>{const e=$('pt');if(e)e.textContent=Math.floor((Date.now()-t0)/1000)+' s'},500));
  view.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    if(!sel||sel.dataset.s===t.dataset.s){view.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));sel=t;t.classList.add('sel');if(t.dataset.s==='L')speak(L[+t.dataset.i].w);return}
    const a=sel.dataset.s==='L'?L[+sel.dataset.i]:R[+sel.dataset.i],b=t.dataset.s==='L'?L[+t.dataset.i]:R[+t.dataset.i];
    if(a===b){[sel,t].forEach(x=>x.classList.add('gone'));done++;gain(10,view.querySelector('.card'));setProg(a,true)}
    else{errors++;[sel,t].forEach(x=>{x.classList.add('miss');setTimeout(()=>x.classList.remove('miss'),400)});setProg(a,false)}
    sel.classList.remove('sel');sel=null;
    if(done===set.length){stopTimers();const s=Math.max(1,Math.round((Date.now()-t0)/1000)),rec=ST.best.pairs==null||s<ST.best.pairs;if(rec){ST.best.pairs=s;saveStats()}confetti(rec?'Record : '+s+' s':'');
      setTimeout(()=>{view.innerHTML='<div class="card center"><p style="color:var(--soft);margin:0">Temps</p><p class="big-n">'+s+' s</p><p>'+errors+' erreur'+(errors>1?'s':'')+(rec?' · nouveau record !':' · record '+ST.best.pairs+' s')+'</p><ul class="missed">'+set.map(w=>'<li><b>'+esc(w.w)+'</b> · '+esc(mean(w))+'</li>').join('')+'</ul><div class="row"><button class="btn" id="hm">Accueil</button><button class="btn main" id="re">Rejouer</button></div></div>';$('re').onclick=pairs;$('hm').onclick=home},500)}})}
/* ---------- Phrase à trous ---------- */
function cloze(){inGame();const pool=weak().filter(w=>w.c);if(pool.length<4)return list();const w=pool[Math.floor(Math.random()*Math.min(12,pool.length))];
  const others=shuffle(pool.filter(x=>x.w.toLowerCase()!==w.w.toLowerCase())).slice(0,3),opts=shuffle([w,...others]);
  view.innerHTML='<div class="card"><div class="meta"><span>'+esc(w.b)+'</span>'+dots(P(w).box)+'</div><p class="ici"><small>Quel mot manque ? Indice : '+esc(mean(w))+'</small></p><p class="ctx" id="cx">'+ctxHTML(w,true)+'</p><div class="opts">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o.w)+'</button>').join('')+'</div><div id="af"></div></div>';
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(view.querySelector('.opt.right'))return;const good=opts[+b.dataset.i]===w;
    view.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.i]===w)x.classList.add('right')});if(!good)b.classList.add('wrong');else gain(10,view.querySelector('.card'));
    setProg(w,good);$('cx').innerHTML=ctxHTML(w);speak(w.w);
    $('af').innerHTML=backHTML(w)+'<div class="row" style="margin-top:12px"><button class="btn main" id="nx">Suivante</button></div>';$('nx').onclick=cloze})}
/* ---------- Fiches (révision espacée) ---------- */
let queue=[];
function cards(){inGame();queue=shuffle(WORDS.filter(w=>P(w).due<=Date.now())).sort((a,b)=>P(a).box-P(b).box);card()}
function card(flipped){
  if(!queue.length){view.innerHTML='<div class="card center"><p class="big-n">✓</p><p>Tout est revu pour aujourd’hui.</p><div class="row"><button class="btn" id="hm">Accueil</button><button class="btn main" id="mo">10 fiches de plus</button></div></div>';$('hm').onclick=home;$('mo').onclick=()=>{queue=weak().slice(0,10);card()};return}
  const w=queue[0];
  view.innerHTML='<div class="card"><div class="meta"><span>'+esc(w.b)+' · '+fmtD(w.d)+'</span>'+dots(P(w).box)+'</div><p class="word">'+esc(w.w)+' <button class="say" aria-label="Écouter">'+ICO.say+'</button></p><p class="ctx">'+ctxHTML(w)+'</p>'+
   (flipped?backHTML(w)+'<div class="row"><button class="btn bad" id="no">Je ne savais pas</button><button class="btn good" id="yes">Je savais</button></div>':'<div class="row"><button class="btn main" id="sh">Voir la traduction</button></div>')+
   '<small style="color:var(--soft)">'+queue.length+' fiche'+(queue.length>1?'s':'')+'</small></div>';
  view.querySelector('.say').onclick=()=>speak(w.w);
  if(!flipped){$('sh').onclick=()=>card(true);return}
  $('yes').onclick=()=>{setProg(w,true);gain(5,view.querySelector('.card'));queue.shift();card()};
  $('no').onclick=()=>{setProg(w,false);queue.push(queue.shift());card()}}
/* ---------- Liste ---------- */
function list(){inGame();view.innerHTML='<input class="search" id="q" type="search" placeholder="Chercher un mot ou une traduction"><div id="it"></div>';
  const draw=s=>{s=s.toLowerCase();const r=WORDS.filter(w=>!s||(w.w+' '+mean(w)+' '+(w.t||[]).map(t=>t[1]).join(' ')).toLowerCase().includes(s));
    $('it').innerHTML=r.map(w=>'<details class="item"><summary><b>'+esc(w.w)+'</b><span>'+esc(mean(w))+'<br>'+dots(P(w).box)+'</span></summary><p class="ctx" style="margin:10px 0">'+ctxHTML(w)+'</p>'+backHTML(w)+'<p class="meta">'+esc(w.b)+' · '+fmtD(w.d)+'</p></details>').join('')||'<p style="color:var(--soft)">Aucun mot.</p>'};
  $('q').oninput=e=>draw(e.target.value);draw('')}
const GAMES={flash,pairs,cloze,cards,list};
/* ---------- démarrage ---------- */
const obj=x=>x&&!Array.isArray(x)&&typeof x==='object'?x:{};
function source(){const h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/i),repo=location.pathname.split('/').filter(Boolean)[0];
  return m&&repo?'https://api.github.com/repos/'+m[1]+'/'+repo+'/contents/words.enc':'words.enc'}
/* clé : dans l'adresse (#k=…), copiée dans l'appareil */
function getKey(){const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);return m?m[1]:local('key')}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=s=>b64(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));
const enc=new TextEncoder();
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
async function hmac(k,d){const key=await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',key,d))}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
async function decrypt(box,keyStr){const K=b64u(keyStr),N=b64(box.n),C=b64(box.c),Ke=await hmac(K,enc.encode('enc')),Km=await hmac(K,enc.encode('mac'));
  if(hex(await hmac(Km,cat(N,C)))!==box.m)throw new Error('cle');
  const n=Math.ceil(C.length/32),ks=await Promise.all(Array.from({length:n},(_,i)=>hmac(Ke,cat(N,new Uint8Array([i>>>24&255,i>>>16&255,i>>>8&255,i&255])))));
  const P=new Uint8Array(C.length);for(let i=0;i<C.length;i++)P[i]=C[i]^ks[i>>5][i&31];
  const txt=P[0]===0x1f&&P[1]===0x8b?await new Response(new Blob([P]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(P);return JSON.parse(txt)}
let badKey=false;
async function fetchWords(){const key=getKey();if(!key){badKey=true;throw 0}
  const u=source(),api=u.startsWith('http');let r=await fetch(u+(api?'?t='+Date.now():''),{cache:'no-store',headers:api?{Accept:'application/vnd.github.raw+json'}:{}});
  if(!r.ok)r=await fetch('words.enc?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
  const box=await r.json();try{const d=await decrypt(box,key);local('key',key);return d}catch(e){badKey=true;throw e}}
let lastCount=(local('words')||[]).length;
async function load(quiet){
  PROG=obj(local('prog'));const ls=obj(local('stats'));ST={xp:ls.xp||0,days:obj(ls.days),best:obj(ls.best)};
  badKey=false;try{const d=await fetchWords();const ws=(d.words||[]).filter(w=>w&&w.w);if(!ws.length&&WORDS.length)throw 0;
    const added=lastCount&&ws.length>lastCount?ws.length-lastCount:0;WORDS=ws;lastCount=ws.length;local('words',WORDS);setOffline(false);
    if(d.updated)$('foot').textContent='Mots mis à jour le '+new Date(d.updated).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' depuis ta Kobo. Ta progression est gardée sur cet appareil.';
    if(added)confetti(added+' nouveau'+(added>1?'x':'')+' mot'+(added>1?'s':'')+' !')}
  catch(e){if(!WORDS.length&&!badKey){WORDS=local('words')||[];lastCount=WORDS.length}if(!badKey||WORDS.length)setOffline(true)}
  if(quiet&&!$('home').hidden)return;
  if(!WORDS.length){view.innerHTML='<div class="card center"><p style="margin:auto">'+(badKey?'Cette appli est privée. Ouvre-la en scannant le QR code de ta Kobo (Outils, Mots Kobo, Ouvrir l’appli sur mon téléphone).':'Tes mots arrivent : la toute première fois, GitHub met une minute à tout mettre en ligne. Rouvre l’appli dans un instant.')+'</p></div>';hud();return}
  home()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(true)});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
load();
}
</script>
