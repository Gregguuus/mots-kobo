<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe94a">
<meta name="apple-mobile-web-app-title" content="Mots Kobo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Mots Kobo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,700&family=Inter+Tight:wght@400;600;800&display=swap">
<style>
/* VOICE: joyeux et rapide, comme un jeu de poche
   IDEA: le feutre fluo du lecteur : chaque bonne réponse surligne un peu plus la page
   PICTURE: la carte de jeu en grand, barre d'XP comme un trait de surligneur
   COLOUR and TYPE: papier blanc, graphite, fluo jaune, vert/rouge pour juste/faux ; Literata + Inter Tight
   LAYOUT: en-tête niveau/série/objectif, tuiles de jeux, puis l'écran de jeu en plein */
:root{color-scheme:light dark;--bg:light-dark(#efeee9,#141412);--card:light-dark(#fff,#1f1f1c);--ink:light-dark(#1b1a17,#f1efe7);--soft:light-dark(#6b6960,#a19f95);--line:light-dark(#dcdad2,#34332e);--hl:light-dark(#ffe94a,#e6cf2a);--ok:light-dark(#1d7a4f,#5fd39a);--ko:light-dark(#c0362c,#ff8a80);--sh:0 18px 40px -26px rgba(0,0,0,.45)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font:800 26px/1 "Inter Tight";margin:0;flex:1}.logo span{background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%)}
.home-btn{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.hud{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:16px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.pill b{font-size:20px;line-height:1}.pill small{display:block;color:var(--soft);font-size:12px}
.xpbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.xpbar i{display:block;height:100%;background:var(--hl);border-radius:6px;transition:width .5s}
.ring{width:38px;height:38px;flex:none}
.banner{background:var(--hl);color:#1b1a17;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:14px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:18px 16px 16px;min-height:132px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.game svg{width:34px;height:34px}
.game b{font-size:19px}.game small{color:var(--soft);font-size:14px;line-height:1.35}
.game .tag{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px}
.game.big{grid-column:1/-1;background:var(--hl);color:#1b1a17;border-color:transparent;min-height:120px}
.game.big small{color:#4a4630}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:clamp(18px,5vw,30px);min-height:420px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--soft);font-size:13px;flex-wrap:wrap;align-items:center}
.word{font:700 clamp(34px,9vw,50px)/1.05 Literata,serif;margin:4px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fr-q{font:700 clamp(24px,6vw,32px)/1.2 "Inter Tight";margin:4px 0 0}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ctx{font:400 17px/1.6 Literata,serif;margin:0}
mark{background:linear-gradient(transparent 12%,var(--hl) 12% 90%,transparent 90%);color:#1b1a17;padding:0 2px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;font-size:16px;line-height:1.35;padding:13px 16px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--ko);box-shadow:inset 0 0 0 2px var(--ko);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{min-height:50px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:16px;flex:1 1 140px}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.good{border-color:var(--ok);color:var(--ok)}.btn.bad{border-color:var(--ko);color:var(--ko)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.back{border-top:1px dashed var(--line);padding-top:12px}
.ici{font:700 21px/1.3 "Inter Tight";margin:0 0 6px}.ici small{display:block;font:600 12px "Inter Tight";color:var(--soft);margin-bottom:2px}
.senses{margin:0;padding-left:18px;color:var(--soft);font-size:15px}.senses i{color:var(--ink)}
.timer{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.timer i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.combo{font-weight:800;font-size:15px;padding:3px 10px;border-radius:999px;background:var(--hl);color:#1b1a17}
.big-n{font:800 clamp(56px,16vw,88px)/1 "Inter Tight";margin:0;text-align:center}
.center{text-align:center}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:64px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;line-height:1.25;transition:opacity .3s,transform .3s}
.tile.en{font:700 18px Literata,serif}
.tile.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
.tile.miss{animation:shake .3s;box-shadow:inset 0 0 0 2px var(--ko)}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.search{width:100%;font:16px "Inter Tight";min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
details.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
details.item summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline;list-style:none}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{font:700 18px Literata,serif}details.item summary span{color:var(--soft);font-size:14px;text-align:right}
.missed{margin:0;padding:0;list-style:none;text-align:left}.missed li{padding:6px 0;border-bottom:1px solid var(--line)}
.foot{color:var(--soft);font-size:13px;margin-top:24px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fx i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
.float{position:absolute;right:20px;top:16px;font-weight:800;color:var(--ok);animation:up .8s ease-out forwards}
@keyframes up{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-28px)}}
.game.wide{grid-column:1/-1;min-height:96px}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.langs button{flex:1;border:0;background:none;border-radius:999px;min-height:44px;cursor:pointer;font-weight:700;font-size:15px;color:var(--soft)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.langs small{font-weight:500;opacity:.75}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:auto}
.grade{min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;display:grid;place-content:center;gap:2px;line-height:1.15;padding:6px 4px}
.grade small{font-weight:500;color:var(--soft);font-size:12px}
.grade.g1{border-color:var(--ko);color:var(--ko)}.grade.g4{border-color:var(--ok);color:var(--ok)}
.new-tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--hl);color:#1b1a17}
.typein{width:100%;font:700 24px Literata,serif;min-height:58px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.typein.ok{border-color:var(--ok)}.typein.ko{border-color:var(--ko);animation:shake .3s}
.hint{font:700 22px/1.3 Literata,serif;letter-spacing:.14em;text-align:center;margin:0;color:var(--soft);word-break:break-word}
.verdict{text-align:center;font-weight:700;margin:0;min-height:1.5em}
.big-say{width:88px!important;height:88px!important;margin:6px auto 0}.big-say svg{width:34px;height:34px}
.stats{display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;box-shadow:var(--sh)}
.panel h2{font:800 17px "Inter Tight";margin:0}.panel p{margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi b{display:block;font:800 28px/1.05 "Inter Tight";font-variant-numeric:tabular-nums}.kpi small{color:var(--soft);font-size:12px}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--hl) 35%,var(--line))}.heat i.l2{background:color-mix(in srgb,var(--hl) 70%,var(--line))}.heat i.l3{background:var(--hl)}.heat i.l4{background:#ff8a1f}.heat i.now{outline:2px solid var(--ink);outline-offset:-1px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--soft)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.fc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:120px}
.fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--soft);min-height:0}
.fc div i{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--ink)}.fc div:first-child i{background:var(--hl)}
.fc div b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.books{width:100%;border-collapse:collapse;font-size:14px}.books td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:middle}.books td.n{text-align:right;color:var(--soft);white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.minibar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.minibar i{display:block;height:100%;background:var(--ok)}
.code{width:100%;min-height:84px;font:12px/1.4 ui-monospace,monospace;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;resize:vertical;word-break:break-all}
.kbd{color:var(--soft);font-size:12px;text-align:center;margin:0}
@media(max-width:420px){.grade{font-size:14px}.kpi b{font-size:24px}}
@media(max-width:420px){.hud{grid-template-columns:1fr 1fr}.hud .pill:first-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 class="logo">Mots <span>Kobo</span></h1><button class="home-btn" id="home" hidden>Accueil</button></div>
  <div id="banner"></div>
  <div class="hud" id="hud"></div>
  <main id="view"><div class="card"><p class="center" style="margin:auto">Chargement de tes mots…</p></div></main>
  <p class="foot" id="foot">Tes nouveaux surlignages arrivent tout seuls dès que ta Kobo a le Wi-Fi. Ta progression est gardée sur cet appareil.</p>
</div>
<div class="fx" id="fx"></div>
<script>
{
const ICO={
 say:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>',
 pairs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="11" rx="2"/><rect x="13" y="9" width="8" height="11" rx="2" fill="var(--hl)"/></svg>',
 gap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h6M15 7h6M3 12h4M17 12h4M3 17h18"/><path d="M9 12h6" stroke="var(--hl)" stroke-width="4"/></svg>',
 cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="14" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4" stroke="var(--hl)" stroke-width="3"/></svg>',
 ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 .5"/><path d="M10 9.5a2 2 0 0 1 4 0" stroke="var(--hl)" stroke-width="3"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V4M4 20h16"/><rect x="7" y="12" width="3" height="5" fill="currentColor"/><rect x="12" y="8" width="3" height="9" fill="var(--hl)" stroke="var(--hl)"/><rect x="17" y="5" width="2" height="12" fill="currentColor"/></svg>',
 quote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8" stroke="var(--hl)" stroke-width="3"/><path d="M8 12.5h5"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 flame:'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#ff8a1f"/><path d="M12 13c1 2 3 3 3 5a3 3 0 0 1-6 0c0-1 1-2 1-3 1 1 2 0 2-2z" fill="#ffe94a"/></svg>'
};
const DAY=864e5,MIN=6e4,GAPS=[0,1,2,4,8,16,32],GOAL=200,NEW_DAY=15,LS='motsKobo.v2';
let WORDS=[],ALL=[],LANG='en',PROG={},ST={xp:0,days:{},best:{},fresh:{}},offline=false,keyH=null;
const $=id=>document.getElementById(id),view=$('view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>ymd(Date.now());
const fmtD=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}catch(e){return d}};
/* ---------- mémoire : répétition espacée (intervalle, facilité, oublis) ---------- */
function P(w){const p=PROG[w.w];if(!p)return{s:0,e:2.5,due:0,reps:0,lapses:0,last:0};
  if(p.s==null){const b=p.box||0;return{s:b?GAPS[b]:0,e:2.5,due:p.due||0,reps:b,lapses:0,last:0}}return p}
const lvl=p=>!p.reps?0:p.s<1?1:p.s<3?2:p.s<7?3:p.s<21?4:p.s<60?5:6;
const mastered=p=>p.reps>0&&p.s>=21;
function schedule(p,g,now=Date.now()){p={...p,last:now};
  if(g===1){p.lapses++;p.e=Math.max(1.3,p.e-.2);p.s=p.reps?Math.max(.5,p.s*.3):0;p.due=now+10*MIN;p.reps++;return p}
  if(!p.reps||p.s<.5)p.s=[0,0,1,2,4][g];
  else{const base=p.s+Math.max(0,(now-p.due)/DAY)/2;p.e=Math.min(3.2,Math.max(1.3,p.e+(g===2?-.15:g===4?.15:0)));p.s=g===2?base*1.2:g===3?base*p.e:base*p.e*1.3}
  p.s=Math.min(p.s,365);p.reps++;p.due=now+p.s*DAY;return p}
const ivl=s=>s<1?Math.max(1,Math.round(s*24))+' h':s<30?Math.round(s)+' j':s<365?Math.round(s/30)+' mois':'1 an';
const mean=w=>w.i||(w.t&&w.t[0]?w.t[0][1]:'?');
const ctxHTML=(w,blank)=>w.c?esc(w.c).replace(/&lt;&lt;(.*?)&gt;&gt;/,(m,x)=>blank?'<span class="blank">&nbsp;</span>':'<mark>'+x+'</mark>'):'<i style="color:var(--soft)">Phrase pas encore retrouvée.</i>';
const dots=b=>'<span class="dots">'+[1,2,3,4,5,6].map(i=>'<i class="'+(i<=b?'on':'')+'"></i>').join('')+'</span>';
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang=LANG==='fr'?'fr-FR':'en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
/* ---------- stockage : Kobo d'abord, copie locale en secours ---------- */
function local(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(LS+k)||'null');localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){return null}}
function setOffline(b){offline=b;$('banner').innerHTML=b?'<div class="banner">Hors connexion : tu joues avec tes mots enregistrés.</div>':''}
const saveStats=()=>local('stats',ST);
const send=()=>{};
const saveProg=()=>local('prog',PROG);
function grade(w,g){const p=P(w);if(!p.reps){ST.fresh[today()]=(ST.fresh[today()]||0)+1;saveStats()}PROG[w.w]=schedule(p,g);saveProg()}
/* dans les jeux : une bonne réponse compte comme « Bien » si le mot était à revoir ; une erreur le fait revenir tout de suite */
function setProg(w,good){const p=P(w),now=Date.now();if(good){if(p.reps&&p.due<=now)grade(w,3)}else{PROG[w.w]={...p,s:p.s*.5,due:now,last:now,lapses:p.lapses+1,e:Math.max(1.3,p.e-.1)};saveProg()}}
function dueQueue(){const now=Date.now(),rev=WORDS.filter(w=>{const p=P(w);return p.reps&&p.due<=now}).sort((a,b)=>P(a).due-P(b).due);
  const fresh=WORDS.filter(w=>!P(w).reps).sort((a,b)=>String(b.d||'').localeCompare(String(a.d||''))).slice(0,Math.max(0,NEW_DAY-(ST.fresh[today()]||0)));return[...rev,...fresh]}
/* ---------- XP, niveaux, série ---------- */
const level=xp=>Math.floor(Math.sqrt(xp/40))+1, lvlXP=l=>40*(l-1)**2;
function streak(){let n=0;const d=new Date();if(!ST.days[today()])d.setDate(d.getDate()-1);while(ST.days[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function gain(n,el){const before=level(ST.xp);ST.xp+=n;ST.days[today()]=(ST.days[today()]||0)+n;saveStats();hud();
  if(el){const f=document.createElement('span');f.className='float';f.textContent='+'+n;el.appendChild(f);setTimeout(()=>f.remove(),800)}
  if(level(ST.xp)>before)confetti('Niveau '+level(ST.xp)+' !')}

   '<div class="stack" role="img" aria-label="'+mast+' maîtrisés, '+learn+' en cours, '+news+' nouveaux"><i style="width:'+pc(mast)+';background:var(--ok)"></i><i style="width:'+pc(learn)+';background:var(--hl)"></i></div>'+
   '<div class="legend"><span style="--c:var(--ok)">Maîtrisés</span><span style="--c:var(--hl)">En cours</span><span style="--c:var(--line)">Nouveaux</span></div></section>'+
   '<section class="panel"><h2>Révisions des 7 prochains jours</h2><div class="fc">'+fc.map(f=>'<div><b>'+f.n+'</b><i style="height:'+Math.max(2,f.n/fmax*80)+'px"></i>'+esc(f.l)+'</div>').join('')+'</div><p style="color:var(--soft);font-size:13px">Plus 15 nouveaux mots par jour au maximum, pris parmi tes derniers surlignages.</p></section>'+
   '<section class="panel"><h2>Ton calendrier</h2><div class="heat-wrap"><div class="heat">'+cells.join('')+'</div></div><p style="color:var(--soft);font-size:13px">'+active+' jour'+(active>1?'s':'')+' de jeu · '+ST.xp+' XP au total · série actuelle '+streak()+' j</p></section>'+
   (books.length?'<section class="panel"><h2>Par livre</h2><table class="books">'+books.map(([b,v])=>'<tr><td>'+esc(b)+'<div class="minibar"><i style="width:'+(v.m/v.n*100)+'%"></i></div></td><td class="n">'+v.m+' / '+v.n+'</td></tr>').join('')+'</table></section>':'')+
   (hard.length?'<section class="panel"><h2>Tes mots les plus coriaces</h2><ul class="missed">'+hard.map(([w,p])=>'<li><b>'+esc(w.w)+'</b> · '+esc(mean(w))+' <span style="color:var(--soft)">· oublié '+p.lapses+' fois</span></li>').join('')+'</ul><div class="row"><button class="btn main" id="drill">Réviser ces mots</button></div></section>':'')+
   '<section class="panel"><h2>Sauvegarde</h2><p style="color:var(--soft);font-size:14px">Ta progression reste sur cet appareil. Copie ce code pour la garder en lieu sûr ou la reprendre sur un autre téléphone.</p><div class="row"><button class="btn" id="cp">Copier mon code</button><button class="btn" id="im">Coller un code</button></div><textarea class="code" id="cd" hidden aria-label="Code de sauvegarde"></textarea><p class="verdict" id="bk" aria-live="polite"></p></section>'+
   '</div>';
  const dr=$('drill');if(dr)dr.onclick=()=>{inGame();queue=hard.map(x=>x[0]);card()};
  const cd=$('cd'),bk=$('bk');
  $('cp').onclick=async()=>{const code=await exportCode();cd.hidden=false;cd.value=code;cd.readOnly=true;
    try{await navigator.clipboard.writeText(code);bk.style.color='var(--ok)';bk.textContent='Code copié. Colle-le dans tes notes.'}catch(e){cd.select();bk.style.color='var(--soft)';bk.textContent='Sélectionne le code et copie-le.'}};
  $('im').onclick=()=>{if(cd.hidden||cd.readOnly){cd.hidden=false;cd.readOnly=false;cd.value='';cd.placeholder='Colle ici ton code MK1…';cd.focus();$('im').textContent='Importer ce code';return}
    importCode(cd.value.trim()).then(k=>{bk.style.color='var(--ok)';bk.textContent='Progression fusionnée : '+k+' mot'+(k>1?'s':'')+' mis à jour.';hud();setTimeout(()=>{if(document.getElementById('bk')===bk)stats()},1400)}).catch(()=>{bk.style.color='var(--ko)';bk.textContent='Ce code ne fonctionne pas. Vérifie qu’il est complet.'})}}
const gz=async(u8,mode)=>new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(mode?new CompressionStream('gzip'):new DecompressionStream('gzip'))).arrayBuffer());
async function exportCode(){const raw=enc.encode(JSON.stringify({v:1,prog:PROG,st:ST}));let b=raw,z='0';try{b=await gz(raw,1);z='1'}catch(e){}
  let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));return'MK1'+z+'.'+btoa(s)}
async function importCode(code){const m=code.match(/^MK1([01])\.([A-Za-z0-9+/=\s]+)$/);if(!m)throw 0;let b=b64(m[2].replace(/\s/g,''));if(m[1]==='1')b=await gz(b,0);
  const d=JSON.parse(new TextDecoder().decode(b));if(!d||d.v!==1)throw 0;let k=0;
  for(const[w,p]of Object.entries(obj(d.prog))){const mine=PROG[w];if(!mine||(p.last||0)>(mine.last||0)||(mine.s==null&&p.s!=null)){PROG[w]=p;k++}}
  const s=obj(d.st);ST.xp=Math.max(ST.xp,s.xp||0);for(const[x,v]of Object.entries(obj(s.days)))ST.days[x]=Math.max(ST.days[x]||0,v);
  for(const[x,v]of Object.entries(obj(s.fresh)))ST.fresh[x]=Math.max(ST.fresh[x]||0,v);const bs=obj(s.best);
  if(bs.flash)ST.best.flash=Math.max(ST.best.flash||0,bs.flash);if(bs.pairs)ST.best.pairs=Math.min(ST.best.pairs||1e9,bs.pairs);
  saveProg();saveStats();return k}
/* ---------- Liste ---------- */
function list(){inGame();view.innerHTML='<input class="search" id="q" type="search" placeholder="Chercher un mot ou une traduction"><div id="it"></div>';
  const draw=s=>{s=s.toLowerCase();const r=WORDS.filter(w=>!s||(w.w+' '+mean(w)+' '+(w.t||[]).map(t=>t[1]).join(' ')).toLowerCase().includes(s));
    $('it').innerHTML=r.map(w=>'<details class="item"><summary><b>'+esc(w.w)+'</b><span>'+esc(mean(w))+'<br>'+dots(lvl(P(w)))+'</span></summary><p class="ctx" style="margin:10px 0">'+ctxHTML(w)+'</p>'+backHTML(w)+'<p class="meta">'+esc(w.b)+' · '+fmtD(w.d)+'</p></details>').join('')||'<p style="color:var(--soft)">Aucun mot.</p>'};
  $('q').oninput=e=>draw(e.target.value);draw('')}
const GAMES={flash,pairs,cloze,cards,list,stats,notes:()=>{location.href='annotations.html'},write:()=>typeGame('write'),dict:()=>typeGame('dict')};
document.addEventListener('keydown',e=>{const t=e.target&&e.target.tagName;if(keyH&&t!=='INPUT'&&t!=='TEXTAREA'&&!e.metaKey&&!e.ctrlKey)keyH(e)});
/* ---------- démarrage ---------- */
const obj=x=>x&&!Array.isArray(x)&&typeof x==='object'?x:{};
function source(){const h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/i),repo=location.pathname.split('/').filter(Boolean)[0];
  return m&&repo?'https://api.github.com/repos/'+m[1]+'/'+repo+'/contents/words.enc':'words.enc'}
/* clé : dans l'adresse (#k=…), copiée dans l'appareil */
function getKey(){const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);return m?m[1]:local('key')}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=s=>b64(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));
const enc=new TextEncoder();
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
async function hmac(k,d){const key=await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',key,d))}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
async function decrypt(box,keyStr){const K=b64u(keyStr),N=b64(box.n),C=b64(box.c),Ke=await hmac(K,enc.encode('enc')),Km=await hmac(K,enc.encode('mac'));
  if(hex(await hmac(Km,cat(N,C)))!==box.m)throw new Error('cle');
  const n=Math.ceil(C.length/32),ks=await Promise.all(Array.from({length:n},(_,i)=>hmac(Ke,cat(N,new Uint8Array([i>>>24&255,i>>>16&255,i>>>8&255,i&255])))));
  const P=new Uint8Array(C.length);for(let i=0;i<C.length;i++)P[i]=C[i]^ks[i>>5][i&31];
  const txt=P[0]===0x1f&&P[1]===0x8b?await new Response(new Blob([P]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(P);return JSON.parse(txt)}
let badKey=false,why='',boxInfo='';
async function fetchWords(){const key=getKey();if(!key){badKey=true;why='nokey';throw 0}
  const u=source(),api=u.startsWith('http');let r=null;try{r=await fetch(u+(api?'?t='+Date.now():''),{cache:'no-store',headers:api?{Accept:'application/vnd.github.raw+json'}:{}})}catch(e){}
  if(!r||!r.ok)r=await fetch('words.enc?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
  const box=await r.json();boxInfo='clé de '+key.length+' caractères · fichier de '+Math.round((box.c||'').length*3/4/1024)+' Ko';
  try{const d=await decrypt(box,key);local('key',key);if(!/k=/.test(location.hash))try{history.replaceState(null,'',location.pathname+location.search+'#k='+key)}catch(e){}return d}catch(e){badKey=true;why=e&&e.message==='cle'?'mac':'decode:'+(e&&(e.name||e.message)||e);throw e}}
function privateMsg(){
  if(why==='nokey')return'Ce téléphone ne connaît pas encore ta clé. Scanne une fois le QR code de ta Kobo (Outils, Mots Kobo, Ouvrir l’appli sur mon téléphone), puis rouvre cette page dans Safari.';
  if(why==='mac')return'Ta clé ne correspond pas aux mots envoyés par ta Kobo : la Kobo a sans doute changé de clé sans renvoyer tes mots. Rouvre le menu Mots Kobo sur la liseuse pour relancer un envoi, puis scanne à nouveau le QR code.<br><small style="color:var(--soft)">Diagnostic : clé refusée · '+esc(boxInfo)+'</small>';
  return'Tes mots n’ont pas pu être déchiffrés sur ce téléphone.<br><small style="color:var(--soft)">Diagnostic : '+esc(why)+' · '+esc(boxInfo)+'</small>'}
let lastCount=(local('words')||[]).length;
async function load(quiet){
  if(!quiet){PROG=obj(local('prog'));const ls=obj(local('stats'));ST={xp:ls.xp||0,days:obj(ls.days),best:obj(ls.best),fresh:obj(ls.fresh)}}
  badKey=false;try{const d=await fetchWords();const ws=(d.words||[]).filter(w=>w&&w.w);if(!ws.length&&WORDS.length)throw 0;
    const added=lastCount&&ws.length>lastCount?ws.length-lastCount:0;ALL=tagLangs(ws);setLang(local('lang')||LANG);lastCount=ws.length;local('words',ws);setOffline(false);
    if(d.updated)$('foot').textContent='Mots mis à jour le '+new Date(d.updated).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' depuis ta Kobo. Ta progression est gardée sur cet appareil.';
    if(added)confetti(added+' nouveau'+(added>1?'x':'')+' mot'+(added>1?'s':'')+' !')}
  catch(e){if(!ALL.length&&!badKey){ALL=tagLangs(local('words')||[]);setLang(local('lang')||LANG);lastCount=ALL.length}if(!badKey||WORDS.length)setOffline(true)}
  if(quiet&&!$('home').hidden)return;
  if(!WORDS.length){view.innerHTML='<div class="card center"><p style="margin:auto">'+(badKey?privateMsg():'Tes mots arrivent : la toute première fois, GitHub met une minute à tout mettre en ligne. Rouvre l’appli dans un instant.')+'</p></div>';hud();return}
  home()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(true)});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
load();
}
</script>
